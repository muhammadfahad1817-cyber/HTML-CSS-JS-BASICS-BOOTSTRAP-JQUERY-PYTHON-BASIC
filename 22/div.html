<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .parent{
        display: flex;
        flex-direction: column;
        outline: solid red;
        height: 500px;
        max-width: 300px;
        justify-content: flex-start;
        align-items: center;
        margin-left: auto;
        margin-right: auto;
        margin-top: 20px;
    }

        .parent2{
        display: flex;
        flex-direction: column;
    
        height: 300px;
        max-width: 300px;
        justify-content: center;
        align-items: center;
        margin-left: auto;
        margin-right: auto;
        margin-top: 50px;
    }

    .user_input{
        width: 200px;
        height: 50px;
        outline: black solid;
    }

    .mybtn{
        width: 100px;
        height: 45px;
    }
    .child{
       display: flex;
       flex-direction: column;
       justify-content: flex-start;
       align-items: flex-start;
    }
</style>
<body>
    <div class="parent">
        <div class="child"><h2 id="result"></h2></div>
        
    <div class="parent2"><input min="1" id="user_input" type="number" class="user_input"><br>
        <button class="mybtn" onclick="Criteria()">Criteria</button></div> 
    </div>

    <script>
         function Criteria(){
        let age =document.getElementById("user_input").value;
      if (age>=18){
        document.getElementById("result").innerHTML="Welcome you are eligible"
        alert("You are eligible")
      }
      else {
          document.getElementById("result").innerHTML="Welcome you are not eligible"
        alert("You are not eligible")
      }
        }
    </script>
</body>
</html>
