<!DOCTYPE html>
<html lang="en">
<head>

    <title>Document</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>

    <div style="background-color: burlywood; width: 100px; height: 100px; position: absolute; border: 2px solid black; text-align: center; margin-left: -7px; padding: 10px; ">

    <script>
        $(document).ready(function
