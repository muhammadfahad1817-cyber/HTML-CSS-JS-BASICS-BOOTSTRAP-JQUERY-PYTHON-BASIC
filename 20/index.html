<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://getbootstrap.com/docs/5.3/assets/css/docs.css" rel="stylesheet">
    <title>Bootstrap Example</title>
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <style>
    h1{
        text-align:center;
        font-family:'Edwardian Script ITC';
        font-weight: bold;
    }
    h1:hover{
        transition: 0.5s;
        color: blue;
        text-transform: uppercase;
        font-family: 'Times New Roman', Times, serif;
    }
.container{
    margin-top: 30px;
    padding: 15px 30px;
    font-style: italic;
    font-size: larger;
    font-weight: bold;
}

 #col1{
    background-color: aquamarine;
    color: rgb(201, 25, 25);
    outline: rgb(0, 0, 0) solid;
 }

#col1:hover{
    background-color: brown;
    color: rgb(6, 20, 82);
    font-family: 'Harlow Solid Italic';
    transition: 0.5s;
}

#col2:hover{
    background-color: rgb(97, 66, 212);
    color: rgb(180, 158, 158);
    font-family: 'Adobe Caslon Pro';
    transition: 0.5s;
}

#col3:hover{
    background-color: rgb(8, 68, 31);
    color: rgb(233, 153, 153);
    font-family: 'Jokerman';
    transition: 0.5s;
}

#col4:hover{
    background-color: rgb(211, 34, 187);
    color: rgb(212, 224, 167);
    font-family: 'Freestyle Script';
    transition: 0.5s;
}

#col5:hover{
    background-color: rgb(133, 1, 1);
    color: rgb(10, 7, 7);
    font-family: 'Forte';
    transition: 0.5s;
}

#col6:hover{
    background-color: rgb(15, 4, 109);
    color: rgb(70, 30, 12);
    font-family: 'Bradley Hand ITC';
    transition: 0.5s;
}



  #col2{
    background-color: rgb(94, 8, 37);
    color: rgb(0, 0, 0);
    outline: rgb(0, 0, 0) solid;
 }

  #col3{
    background-color: rgb(134, 119, 86);
    color: rgb(51, 4, 4);
    outline: rgb(0, 0, 0) solid;
 }

  #col4{
    background-color: rgb(156, 30, 125);
    color: rgb(221, 187, 187);
    outline: rgb(0, 0, 0) solid;
 }

  #col5{
    background-color: rgb(229, 127, 255);
    color: rgb(9, 21, 88);
    outline: rgb(0, 0, 0) solid;
 }

  #col6{
    background-color: rgb(77, 140, 212);
    color: rgb(201, 183, 25);
    outline: rgb(0, 0, 0) solid;
 }
 .p-3{
    background: #9994ac;
 }
  </style>
  <body class="p-3 m-0 border-0 bd-example m-0 border-0 bd-example-row">
    <h1>Grid</h1>
    <!-- Example Code Start-->
    <div class="container text-center">
      <div class="row">
        <div class="col" id="col1">Hp</div>
        <div class="col" id="col2">Dell</div>
        <div class="col" id="col3" >Apple</div>
        <div class="col" id="col4" >Samsung</div>
      </div>
      <div class="row">
        <div class="col-8" id="col5">Asus</div>
        <div class="col-4" id="col6">Lenovo</div>
      </div>
    </div>
    <!-- Example Code End -->
  </body>
</html>
